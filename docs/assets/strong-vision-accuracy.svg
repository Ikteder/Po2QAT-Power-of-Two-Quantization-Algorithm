<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Strong-profile vision accuracy comparison</title>
  <desc id="desc">CNN improves from 53.3 to 63.8 percent. TinyViT improves from 20.8 to 28.2 percent after power-of-two quantization-aware training.</desc>
  <rect width="760" height="390" rx="14" fill="#f8fafc"/>
  <text x="36" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Vision accuracy — strong profile</text>
  <text x="36" y="68" font-family="system-ui, sans-serif" font-size="13" fill="#475569">CIFAR-10 test subset · seed 42 · higher is better</text>
  <line x1="90" y1="310" x2="720" y2="310" stroke="#94a3b8"/>
  <line x1="90" y1="100" x2="90" y2="310" stroke="#94a3b8"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#64748b">
    <text x="58" y="314">0%</text><text x="50" y="254">20%</text><text x="50" y="194">40%</text><text x="50" y="134">60%</text>
  </g>
  <g stroke="#e2e8f0"><line x1="90" y1="250" x2="720" y2="250"/><line x1="90" y1="190" x2="720" y2="190"/><line x1="90" y1="130" x2="720" y2="130"/></g>
  <rect x="180" y="150.1" width="74" height="159.9" rx="5" fill="#64748b"/>
  <rect x="264" y="118.6" width="74" height="191.4" rx="5" fill="#2563eb"/>
  <rect x="480" y="247.6" width="74" height="62.4" rx="5" fill="#64748b"/>
  <rect x="564" y="225.4" width="74" height="84.6" rx="5" fill="#2563eb"/>
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="217" y="140">53.3%</text><text x="301" y="108">63.8%</text><text x="517" y="238">20.8%</text><text x="601" y="216">28.2%</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#334155">
    <text x="259" y="340">SmallCNN</text><text x="559" y="340">TinyViT</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#475569">
    <rect x="242" y="363" width="14" height="14" rx="2" fill="#64748b"/><text x="264" y="375">Initial FP32</text>
    <rect x="380" y="363" width="14" height="14" rx="2" fill="#2563eb"/><text x="402" y="375">Final Po2</text>
  </g>
</svg>
